server.port=${SERVER_PORT:8088}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
spider.workspace=${SPIDER_WORKSPACE:/data/spider}
spider.job.enable=${SPIDER_JOB_ENABLE:false}
spider.thread.max=${SPIDER_THREAD_MAX:64}
spider.thread.default=${SPIDER_THREAD_DEFAULT:8}
spider.bloomfilter.capacity=1000000
spider.bloomfilter.error-rate=0.0001

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=${TZ:Asia/Shanghai}
spring.jackson.serialization.fail_on_empty_beans=false
spring.mvc.favicon.enabled=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/spiderflow?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spiderflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.druid.validation-query=SELECT 1

spring.mail.protocol=smtp
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECT_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

spider.notice.subject=spider-flow\u6d41\u7a0b\u901a\u77e5
spider.notice.content.start=\u6d41\u7a0b\u5f00\u59cb\u6267\u884c\uff1a{name}\uff0c\u5f00\u59cb\u65f6\u95f4\uff1a{currentDate}
spider.notice.content.end=\u6d41\u7a0b\u6267\u884c\u5b8c\u6bd5\uff1a{name}\uff0c\u7ed3\u675f\u65f6\u95f4\uff1a{currentDate}
spider.notice.content.exception=\u6d41\u7a0b\u53d1\u751f\u5f02\u5e38\uff1a{name}\uff0c\u5f02\u5e38\u65f6\u95f4\uff1a{currentDate}
